name: Build RunPod worker image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runpod-worker-image.yml
      - docker/runpod-worker.Dockerfile
      - scripts/**
      - worker/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runpod-worker.Dockerfile
          push: true
          tags: ghcr.io/ghraed/newmenuscanapi-gpu-worker:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/ghraed/newMenuScanAPI
